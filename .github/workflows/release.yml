name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(tr -d '[:space:]' < VERSION)
          test "$TAG" = "v$VER"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
