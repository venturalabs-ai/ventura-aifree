name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Validate SemVer tag and project version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid SemVer tag: $TAG" >&2; exit 1; }
          VER=$(tr -d '[:space:]' < VERSION)
          test "$TAG" = "v$VER" || { echo "Tag $TAG does not match VERSION $VER" >&2; exit 1; }
      - name: Install and validate release
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Package static application and checksums
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "ventura-aifree-${GITHUB_REF_NAME}.tar.gz" out
          sha256sum "ventura-aifree-${GITHUB_REF_NAME}.tar.gz" sbom.spdx.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            ventura-aifree-${{ github.ref_name }}.tar.gz
            sbom.spdx.json
            SHA256SUMS
